<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="600" fill="#f4f5f7"/>
  <text x="40" y="38" font-size="20" font-weight="600" fill="#1d1f24">Desk Button — front view, to scale (132 × 56 × 72 mm)</text>

  <!-- scale 4 px/mm, front view: x = 330 + 4*X, y = 440 - 4*Z -->
  <line x1="40" y1="446" x2="620" y2="446" stroke="#c9ccd3" stroke-width="1.5"/>
  <!-- press bar (104 wide, 3 mm proud) -->
  <rect x="122" y="204" width="416" height="16" rx="4" fill="#18181b"/>
  <!-- body -->
  <rect x="66" y="216" width="528" height="224" rx="12" fill="#e6e6e3" stroke="#d2d2ce"/>
  <!-- black screen panel 121 x 45 -->
  <rect x="88" y="238" width="484" height="180" rx="20" fill="#121214"/>
  <!-- OLED content (active area 76.8 x 19.2 mm) -->
  <g transform="translate(176.4,289.6)">
    <text x="0" y="62" font-size="60" font-family="Bahnschrift, Segoe UI, sans-serif" font-weight="300" fill="#e9e9e4">24:07</text>
    <line x1="208" y1="6" x2="208" y2="70" stroke="#e9e9e4" stroke-width="1"/>
    <circle cx="222" cy="16" r="5" fill="#e9e9e4"/>
    <text x="232" y="21" font-size="14" font-weight="700" fill="#e9e9e4">REC</text>
    <text x="216" y="45" font-size="11" fill="#e9e9e4">Premiere Pro</text>
    <text x="216" y="66" font-size="11" fill="#e9e9e4">today 3h 12m</text>
  </g>
  <!-- feet -->
  <rect x="122" y="440" width="40" height="6" rx="2" fill="#555"/>
  <rect x="498" y="440" width="40" height="6" rx="2" fill="#555"/>

  <g stroke="#8a8f99" stroke-width="1" fill="#8a8f99" font-size="12">
    <line x1="66" y1="476" x2="594" y2="476"/>
    <line x1="66" y1="468" x2="66" y2="484"/><line x1="594" y1="468" x2="594" y2="484"/>
    <text x="312" y="498" stroke="none">132 mm</text>
    <line x1="618" y1="216" x2="618" y2="440"/>
    <line x1="610" y1="216" x2="626" y2="216"/><line x1="610" y1="440" x2="626" y2="440"/>
    <text x="630" y="332" stroke="none">56</text>
  </g>

  <g font-size="14" fill="#1d1f24">
    <text x="680" y="120" font-weight="600">Press bar</text>
    <text x="680" y="144">press anywhere: start / stop</text>
    <text x="680" y="166">hold 0.7 s: open Timer window</text>
    <text x="680" y="188" fill="#666b75">hinged at the back,</text>
    <text x="680" y="208" fill="#666b75">clicky switch underneath</text>
    <text x="680" y="262" font-weight="600">Screen</text>
    <text x="680" y="286">recording: time, app, today</text>
    <text x="680" y="308">ready: today's total</text>
    <text x="680" y="330">no PC: "PC offline"</text>
    <text x="680" y="384" font-weight="600">Back</text>
    <text x="680" y="408">USB-C (power + data)</text>
  </g>
  <text x="40" y="560" font-size="13" fill="#666b75">Body: white or light grey. Screen panel and bar: black. The OLED's unlit pixels are black too, so the whole panel reads as one screen.</text>
</svg>
