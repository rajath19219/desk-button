<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" r="0.5">
      <stop offset="0.52" stop-color="#ff4848" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#ff4848" stop-opacity="0.55"/>
      <stop offset="0.82" stop-color="#ff7a7a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff4848" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cap" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ff8a80"/><stop offset="1" stop-color="#c62828"/>
    </radialGradient>
  </defs>
  <rect width="900" height="680" fill="#f4f5f7"/>
  <text x="40" y="38" font-size="20" font-weight="600" fill="#1d1f24">Desk Button — concept, drawn to scale (124 × 84 × 44 mm)</text>

  <!-- ===== top view ===== -->
  <text x="40" y="64" font-size="13" fill="#666b75">TOP VIEW</text>
  <rect x="106.8" y="58.8" width="446.4" height="302.4" rx="57.6" fill="#2b2d31"/>
  <rect x="121.2" y="73.2" width="417.6" height="273.6" rx="43.2" fill="#34373d"/>
  <!-- display -->
  <circle cx="214.8" cy="202.8" r="76" fill="none" stroke="#25272b" stroke-width="4.3"/>
  <circle cx="214.8" cy="202.8" r="59.4" fill="#000"/>
  <g fill="none" stroke="#2b2d33" stroke-width="2.4">
    <circle cx="214.8" cy="202.8" r="55"/>
  </g>
  <path d="M214.8 147.8 A55 55 0 0 1 262.4 175.3" fill="none" stroke="#ff4848" stroke-width="2.4"/>
  <circle cx="198" cy="172" r="3.2" fill="#ff4848"/>
  <text x="205" y="176" font-size="10" font-weight="700" fill="#ff4848">REC</text>
  <text x="214.8" y="213" font-size="30" font-weight="600" text-anchor="middle" fill="#ebebf0" font-family="Consolas, monospace">24:07</text>
  <text x="214.8" y="232" font-size="9" text-anchor="middle" fill="#ebebf0">Premiere Pro</text>
  <text x="214.8" y="245" font-size="7" text-anchor="middle" fill="#7a7e88">today 3h 12m</text>
  <!-- halo + button -->
  <circle cx="427.2" cy="202.8" r="112" fill="url(#glow)"/>
  <circle cx="427.2" cy="202.8" r="100.8" fill="#f2e6e6" opacity="0.9"/>
  <circle cx="427.2" cy="202.8" r="100.8" fill="#ff5a5a" opacity="0.35"/>
  <circle cx="427.2" cy="202.8" r="59.4" fill="#1d1f24"/>
  <circle cx="427.2" cy="202.8" r="43.2" fill="url(#cap)"/>
  <!-- depth dimension -->
  <g stroke="#8a8f99" stroke-width="1" fill="#8a8f99" font-size="12">
    <line x1="572" y1="58.8" x2="572" y2="361.2"/>
    <line x1="562" y1="58.8" x2="582" y2="58.8"/><line x1="562" y1="361.2" x2="582" y2="361.2"/>
    <text x="580" y="214" stroke="none">84</text>
  </g>

  <!-- ===== front view ===== -->
  <text x="40" y="400" font-size="13" fill="#666b75">FRONT VIEW</text>
  <line x1="60" y1="607.2" x2="600" y2="607.2" stroke="#c9ccd3" stroke-width="1.5"/>
  <polygon points="106.8,600 553.2,600 553.2,456 538.8,441.6 121.2,441.6 106.8,456" fill="#2b2d31"/>
  <line x1="106.8" y1="589.2" x2="553.2" y2="589.2" stroke="#4a4e57" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="149.8" y="600" width="32" height="7.2" rx="2" fill="#555"/>
  <rect x="478.2" y="600" width="32" height="7.2" rx="2" fill="#555"/>
  <rect x="326.4" y="438" width="201.6" height="4" rx="2" fill="#ff6a6a"/>
  <ellipse cx="427.2" cy="440" rx="120" ry="10" fill="#ff4848" opacity="0.25"/>
  <rect x="367.8" y="420" width="118.8" height="21.6" rx="4" fill="#1d1f24"/>
  <rect x="384" y="405.6" width="86.4" height="16" rx="7" fill="url(#cap)"/>
  <g stroke="#8a8f99" stroke-width="1" fill="#8a8f99" font-size="12">
    <line x1="106.8" y1="632" x2="553.2" y2="632"/>
    <line x1="106.8" y1="624" x2="106.8" y2="640"/><line x1="553.2" y1="624" x2="553.2" y2="640"/>
    <text x="318" y="652" stroke="none">124 mm</text>
    <line x1="84" y1="441.6" x2="84" y2="600"/>
    <line x1="76" y1="441.6" x2="92" y2="441.6"/><line x1="76" y1="600" x2="92" y2="600"/>
    <text x="48" y="526" stroke="none">44</text>
  </g>
  <text x="330" y="584" font-size="11" text-anchor="middle" fill="#8a8f99">bottom plate (4 screws, 4 rubber feet)</text>

  <!-- ===== notes ===== -->
  <g font-size="14" fill="#1d1f24">
    <text x="640" y="110" font-weight="600">Glow ring</text>
    <circle cx="648" cy="136" r="7" fill="#ff4848"/><text x="664" y="141">recording</text>
    <circle cx="648" cy="162" r="7" fill="#3c8f5f"/><text x="664" y="167">ready (dim green)</text>
    <circle cx="648" cy="188" r="7" fill="#f0a63a"/><text x="664" y="193">PC not connected</text>
    <circle cx="648" cy="214" r="7" fill="#fff" stroke="#bbb"/><text x="664" y="219">flash = press seen</text>
    <text x="640" y="268" font-weight="600">Button</text>
    <text x="640" y="292">tap: start / stop</text>
    <text x="640" y="314">hold 0.7 s: open Timer window</text>
    <text x="640" y="368" font-weight="600">Display</text>
    <text x="640" y="392">running time, current app,</text>
    <text x="640" y="414">today's total</text>
    <text x="640" y="468" font-weight="600">Back</text>
    <text x="640" y="492">USB-C (power + data)</text>
  </g>
</svg>
