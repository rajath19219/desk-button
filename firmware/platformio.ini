; Desk Button firmware — ESP32-C3 SuperMini + 3.12" 256x64 SSD1322 OLED + one keyboard switch
; Build & upload: open this folder in VS Code with the PlatformIO extension, click the → (Upload) arrow.

[env:supermini]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1          ; use the chip's built-in USB (no driver needed on Windows 10/11)
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; Serial = the USB port
lib_deps =
    olikraus/U8g2@^2.35.19
