; Desk Button firmware — ESP32-C3 SuperMini + 1.28" round GC9A01 + WS2812 16-LED ring
; Build & upload: open this folder in VS Code with the PlatformIO extension, click the → (Upload) arrow.

[env:supermini]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1          ; use the chip's built-in USB (no driver needed on Windows 10/11)
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; Serial = the USB port
lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
    adafruit/Adafruit NeoPixel@1.12.3
