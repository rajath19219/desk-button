; Desk Button firmware — ESP32-C3 SuperMini
; Open this folder in VS Code with the PlatformIO extension. Pick a build in the PlatformIO sidebar
; (Project Tasks > <name> > Upload), or change default_envs below and press the → Upload arrow.
;
;   bare       prototype stage 1: just the board. Press its BOOT button; blue LED on = recording.
;   proto      prototype stage 2: + 0.96" SSD1306 I2C OLED + any push button
;   proto13    same, for a 1.3" SH1106 I2C OLED (use if the 0.96" build shows a shifted/garbled picture)
;   final      the real build: 3.12" SSD1322 SPI OLED + Choc switch under the press bar

[platformio]
default_envs = bare

[env]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1          ; use the chip's built-in USB (no driver needed on Windows 10/11)
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; Serial = the USB port
lib_deps =
    olikraus/U8g2@^2.35.19

[env:bare]
build_flags = ${env.build_flags} -D DISPLAY_KIND=0

[env:proto]
build_flags = ${env.build_flags} -D DISPLAY_KIND=1

[env:proto13]
build_flags = ${env.build_flags} -D DISPLAY_KIND=3

[env:final]
build_flags = ${env.build_flags} -D DISPLAY_KIND=2
